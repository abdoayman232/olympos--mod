name: Build Mod JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Mod JAR
        working-directory: twilight-of-olympus-ultra-v3
        run: gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: olympus-mod-jar
          path: twilight-of-olympus-ultra-v3/build/libs/twilight-of-olympus-ultra-aether-3.0.0.jar
